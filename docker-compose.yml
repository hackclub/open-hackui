services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "5781:8080"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2Gi
    env_file:
      - ./.env
    volumes:
      - open-webui:/app/backend/data
    networks:
      - internal
    environment:
      PROXY_URL: ${PROXY_URL}
      EXTERNAL_PWA_MANIFEST_URL: https://${PROXY_URL}/backend/manifest.json

  nginx-cors-proxy:
    build:
      context: .
      dockerfile: NGINX.Dockerfile
    ports:
      - "8281:80"
    restart: unless-stopped
    networks:
      - internal

  inserther:
    build:
      context: ./inserther
      dockerfile: DOCKERFILE
    restart: unless-stopped
    volumes:
      - ./.env:/app/.env:ro
    networks:
      internal:
        ipv4_address: 10.99.0.10

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.0.0/24

volumes:
  open-webui: